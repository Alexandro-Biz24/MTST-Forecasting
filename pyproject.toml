[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mtst-forecasting"
version = "0.1.1"
description = "Configurable multi-resolution time series Transformer for PyTorch"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Alexandro Bizeul" }]

keywords = [
    "time-series",
    "forecasting",
    "transformer",
    "pytorch",
    "multi-resolution"
]

classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "torch>=2.2",
    "numpy>=1.24"
]

[project.urls]
Homepage = "https://github.com/Alexandro-Biz24/MTST-Forecasting"
Repository = "https://github.com/Alexandro-Biz24/MTST-Forecasting"

[project.optional-dependencies]
dev = ["pytest>=8", "build>=1", "twine>=5"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["mtst*"]

[tool.pytest.ini_options]
testpaths = ["tests"]